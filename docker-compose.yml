version: '3.8'

services:
  db:
    image: postgres:15
    container_name: blogpost_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blogpost_network

  app:
    build: .
    container_name: blogpost_app
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - blogpost_network
    volumes:
      - .:/app

volumes:
  postgres_data:

networks:
  blogpost_network:
    driver: bridge