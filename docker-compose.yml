version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: ddd_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-ddd_project}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ddd_network

  # FastAPI Application
  app:
    build: .
    container_name: ddd_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-ddd_project}
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - ddd_network

volumes:
  postgres_data:

networks:
  ddd_network:
    driver: bridge